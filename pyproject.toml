[project]
name = "mfg-c2-066"
version = "0.1.0"
description = "Product Liability & PL Law Compliance Q&A Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm — a local stub path on PYTHONPATH for stub-era repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the CI pipeline configuration). Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# The installed agenticstar-agentcore wheel ships no py.typed marker (PEP 561) for
# framework/ or shared/, so every import from them is reported as import-untyped,
# which then cascades into disallow_subclassing_any errors for every node/graph
# class in this repo. Root cause is SDK-side (request:coe candidate); these
# overrides are the verified local mitigation (confirmed against real CI on
# other fleet templates, pipeline runs with a Python 3.11.16 runner).
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.*"
# Every node/graph class inherits from an Any-typed framework base class (see
# above) - strict mode's subclass check has no real signal to give here without
# SDK-side stubs.
disallow_subclassing_any = false
