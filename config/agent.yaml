# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. See the manifest schema reference.
id: "MFG-C2-066"
name: "Product Liability & PL Law Compliance Q&A Agent"
namespace: "mfg"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. ActionGuideGenerateNode resolves a fresh Azure
# OpenAI client per invocation from bound secrets and degrades to the
# deterministic action guide on any failure (missing secret, API error,
# unusable response) — an LLM outage is not a pipeline failure. See
# docs/02_design.md "LLM degrade policy".
generation_mode: "llm"
industry: "MFG"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "VectorRAGAgent"

# Entry point — single dotted import path (module.Class).
class: "src.graph.graph.MFGPLComplianceAgent"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# AZURE_OPENAI_API_KEY / AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT are
# deliberately NOT under requires.secrets: that field is enforced via
# require_at_compile() (hard-fail if absent, mediator/registry/agent_registry.py),
# but ActionGuideGenerateNode reads them via ctx.secrets.require() and degrades
# gracefully on MissingSecret — declaring them here would contradict that
# degrade contract and fail registry-based compiles that should boot key-less
# (same precedent as ANTHROPIC_API_KEY in the scaffold's own reference agent.yaml).
requires:
  secrets: []
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI

# generation_mode is deployment identity, not a tunable provider setting. Runtime
# parameters (max_retry, timeout_s, ...) live in config/config.yaml — AgentRegistry
# loads that file separately and passes it as Graph(config=...).
